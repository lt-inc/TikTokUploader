[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terex-tiktok-uploader"
version = "0.1.0"
description = "Session and publishing worker for Terex"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]==0.34.2", "httpx==0.28.1",
  "cryptography==44.0.2", "pika==1.3.2", "requests[socks]==2.32.3",
  "requests-auth-aws-sigv4==0.7", "phantomwright==0.2.0",
  "phantomwright-driver==1.58.3", "curl_cffi==0.16.3", "Pillow==11.2.1", "prometheus-client==0.21.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autotok = ["signer_js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
